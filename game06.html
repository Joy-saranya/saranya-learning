<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เกมจัดหมวดหมู่</title>
<style>
:root{
  --pink:#ff4f9a;--pink2:#ff8fc0;--green:#4aa72a;--blue:#348bdc;--ink:#3c2f39;
}
*{box-sizing:border-box}
body{
  margin:0;font-family:Tahoma,"Noto Sans Thai",sans-serif;color:var(--ink);
  min-height:100vh;background:
  radial-gradient(circle at 15% 18%,rgba(255,255,255,.95) 0 6%,transparent 6.5%),
  radial-gradient(circle at 82% 14%,rgba(255,255,255,.9) 0 5%,transparent 5.5%),
  linear-gradient(#52c3ff 0 43%,#93df56 43% 100%);
}
.game{max-width:1400px;margin:auto;padding:18px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.btn{
  border:0;border-radius:22px;padding:13px 22px;font-size:clamp(18px,2vw,28px);
  font-weight:900;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18);
}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.sound{background:#fff3a7;border:3px solid #e6ad00}
.scorebox{
  background:#fff8fb;border:4px solid var(--pink);border-radius:28px;
  padding:8px 28px;text-align:center;min-width:180px;box-shadow:0 6px 12px #0002
}
.scorebox b{font-size:clamp(22px,2.2vw,34px)} .score{font-size:clamp(46px,4vw,68px);font-weight:900;line-height:1}
.titleWrap{text-align:center;margin-top:0}
h1{
  display:inline-block;margin:0;padding:15px 46px;font-size:clamp(38px,5vw,72px);
  color:#fff;text-shadow:0 4px 0 #6e4b25,0 0 5px #6e4b25;
  background:linear-gradient(#ffc955,#e89a28);border:6px solid #8e5d20;border-radius:30px;
  box-shadow:inset 0 4px #ffe8a8,0 7px 13px #0003
}
.subtitle{
  display:block;width:max-content;max-width:90%;margin:8px auto 0;background:#fff0bb;
  border:3px solid #dfad4d;border-radius:24px;padding:8px 36px;font-size:clamp(18px,2vw,28px);font-weight:800
}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin:28px auto 18px;max-width:1150px}
.zone{
  min-height:360px;border:5px solid;border-radius:34px;padding:26px 20px 18px;
  background:rgba(255,255,255,.92);box-shadow:0 10px 0 #0002,inset 0 0 30px #fff;
  transition:.2s;position:relative
}
.zone.fruit{border-color:#70c232;background:linear-gradient(135deg,#fff,#f1ffe7)}
.zone.food{border-color:#3495e7;background:linear-gradient(135deg,#fff,#eaf7ff)}
.zone.hover{transform:scale(1.02);filter:brightness(1.05)}
.zoneTitle{
  margin:-58px auto 8px;width:82%;padding:12px;border-radius:28px;text-align:center;
  font-size:clamp(24px,2.8vw,40px);font-weight:900;color:white;box-shadow:0 6px 0 #0003
}
.fruit .zoneTitle{background:linear-gradient(#65cb38,#2e9b18)}
.food .zoneTitle{background:linear-gradient(#58b1ff,#256cc6)}
.basketWrap{height:245px;display:flex;justify-content:center;align-items:center}
.basketImg{max-width:90%;max-height:235px;object-fit:contain;filter:drop-shadow(0 8px 5px #0003);border-radius:24px}
.hint{text-align:center;font-size:clamp(20px,2vw,30px);font-weight:900}
.placed{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;min-height:55px;margin-top:5px}
.placed img{width:58px;height:58px;object-fit:cover;border-radius:14px;box-shadow:0 3px 7px #0003;animation:pop .25s}
.tray{
  max-width:1240px;margin:14px auto;background:rgba(255,255,255,.94);border:5px solid #c39bec;
  border-radius:32px;padding:18px;display:grid;grid-template-columns:repeat(6,1fr);gap:14px;box-shadow:0 8px 0 #0002
}
.item{
  min-height:150px;border-radius:24px;border:0;background:white;box-shadow:0 6px 12px #0002;
  cursor:grab;padding:8px;transition:.15s;overflow:hidden
}
.item img{width:100%;height:135px;object-fit:cover;border-radius:18px;pointer-events:none}
.item:hover,.item.selected{transform:translateY(-7px) scale(1.04);outline:5px solid #ffd84c}
.item.dragging{opacity:.45} .item.done{visibility:hidden;pointer-events:none}
.bottom{display:flex;justify-content:space-between;align-items:center;gap:15px;max-width:1320px;margin:auto}
.help{background:#7a4cda;color:#fff} .restart{background:linear-gradient(#ff72b3,#ec2f7f);color:#fff}
.instruction{flex:1;text-align:center;background:#fff3cf;border:3px solid #ddb36a;border-radius:22px;padding:14px;font-size:clamp(16px,1.8vw,25px);font-weight:900}
.toast{
  position:fixed;left:50%;top:45%;transform:translate(-50%,-50%) scale(.6);
  background:#fff;border:5px solid #ffc400;border-radius:28px;padding:22px 40px;
  font-size:clamp(30px,4vw,56px);font-weight:900;box-shadow:0 12px 40px #0005;
  opacity:0;pointer-events:none;z-index:10
}
.toast.show{animation:toast .85s}
dialog{border:0;border-radius:32px;padding:0;box-shadow:0 20px 70px #0007;max-width:520px;width:90%}
dialog::backdrop{background:#0008}
.modal{padding:35px;text-align:center;background:linear-gradient(#fff,#fff2c9)}
.modal h2{font-size:42px;margin:0 0 15px;color:#e82f7d}
.modal .big{font-size:70px;font-weight:900;color:#2e9a28}
.modal p{font-size:24px}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}25%,75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0}}
@media(max-width:800px){
  .zones{grid-template-columns:1fr;gap:70px;margin-top:65px}
  .zone{min-height:300px} .tray{grid-template-columns:repeat(3,1fr)}
  .item{min-height:110px} .item img{height:105px}
  .bottom{flex-wrap:wrap} .instruction{order:-1;flex-basis:100%}
  .scorebox{min-width:120px;padding:8px 13px}
}
</style>
</head>

  <div class="bottom">
    <button class="btn help" id="helpBtn">❔ วิธีเล่น</button>
    <div class="instruction">💡 ลากภาพ หรือแตะภาพแล้วแตะตะกร้าที่ถูกต้อง</div>
    <button class="btn restart" id="restartBtn">↻ เริ่มใหม่</button>
  </div>
</main>

<div class="toast" id="toast"></div>
<dialog id="finishDialog">
  <div class="modal">
    <h2>🎉 เก่งมากค่ะ!</h2>
    <div class="big"><span id="finalScore">6</span>/6</div>
    <p>จัดหมวดหมู่ครบทุกภาพแล้ว</p>
    <button class="btn restart" onclick="restartGame()">เล่นอีกครั้ง</button>
  </div>
</dialog>

<script>
let score=0,selected=null,soundOn=true;
const items=[...document.querySelectorAll('.item')];
const zones=[...document.querySelectorAll('.zone')];
const scoreEl=document.getElementById('score');
const toast=document.getElementById('toast');
const finishDialog=document.getElementById('finishDialog');

function speak(text){
  if(!soundOn||!('speechSynthesis'in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='th-TH';u.rate=.9;u.pitch=1.1;
  const v=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase().includes('th'));
  if(v)u.voice=v;speechSynthesis.speak(u);
}

function playChime(){
  if(!soundOn) return;
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const now=ctx.currentTime;
    const o=ctx.createOscillator();
    const g=ctx.createGain();
    o.type='triangle';
    o.frequency.setValueAtTime(880,now);
    o.frequency.exponentialRampToValueAtTime(1320,now+0.12);
    g.gain.setValueAtTime(0.001,now);
    g.gain.exponentialRampToValueAtTime(0.18,now+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,now+0.25);
    o.connect(g); g.connect(ctx.destination);
    o.start(now); o.stop(now+0.26);
  }catch(e){}
}

function showToast(text,ok=true){
  toast.textContent=(ok?'✅ ':'❌ ')+text;toast.style.borderColor=ok?'#ffc400':'#ff5b6e';
  toast.classList.remove('show');void toast.offsetWidth;toast.classList.add('show');
}
function place(item,zone){
  if(!item||item.classList.contains('done'))return;
  if(item.dataset.type===zone.dataset.type){
    score++;scoreEl.textContent=score;
    const pic=item.querySelector('img').cloneNode();pic.alt=item.dataset.name;
    document.getElementById(zone.dataset.type+'Placed').appendChild(pic);
    item.classList.add('done');selected=null;showToast('ถูกต้อง เก่งมากค่ะ');
    playChime();
    if(score===6) speak('ยอดเยี่ยมค่ะ จัดหมวดหมู่ครบแล้ว');
    if(score===6)setTimeout(()=>{document.getElementById('finalScore').textContent=score;finishDialog.showModal()},900);
  }else{
    showToast('ลองใหม่อีกครั้งนะคะ',false);speak('ยังไม่ถูกค่ะ ลองใหม่อีกครั้งนะคะ');
    item.animate([{transform:'translateX(-10px)'},{transform:'translateX(10px)'},{transform:'translateX(0)'}],{duration:300});
  }
}
items.forEach(item=>{
  item.addEventListener('dragstart',e=>{selected=item;item.classList.add('dragging');e.dataTransfer.setData('text/plain',item.dataset.name)});
  item.addEventListener('dragend',()=>item.classList.remove('dragging'));
  item.addEventListener('click',()=>{if(selected)selected.classList.remove('selected');selected=item;item.classList.add('selected');speak('เลือก '+item.dataset.name+' แล้วค่ะ')});
});
zones.forEach(zone=>{
  zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('hover')});
  zone.addEventListener('dragleave',()=>zone.classList.remove('hover'));
  zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('hover');place(selected,zone)});
  zone.addEventListener('click',()=>{if(selected){selected.classList.remove('selected');place(selected,zone)}});
});
document.getElementById('soundBtn').onclick=()=>{
  soundOn=!soundOn;document.getElementById('soundBtn').textContent=soundOn?'🔊 เปิดเสียง':'🔇 ปิดเสียง';
  if(soundOn)speak('เปิดเสียงแล้วค่ะ');
};
document.getElementById('helpBtn').onclick=()=>{showToast('ลากภาพ หรือแตะภาพแล้วแตะตะกร้า');speak('ลากภาพไปวางในตะกร้าที่ถูกต้อง หรือแตะภาพ แล้วแตะตะกร้าค่ะ')};
document.getElementById('restartBtn').onclick=restartGame;
function restartGame(){
  score=0;scoreEl.textContent=0;selected=null;
  document.getElementById('fruitPlaced').innerHTML='';document.getElementById('foodPlaced').innerHTML='';
  items.forEach(i=>i.classList.remove('done','selected','dragging'));
  if(finishDialog.open)finishDialog.close();speak('เริ่มเกมใหม่ค่ะ');
}
window.restartGame=restartGame;
window.addEventListener('load',()=>setTimeout(()=>speak('เกมจัดหมวดหมู่ ลากภาพแล้ววางให้ถูกหมวดหมู่ค่ะ'),500));
</script>
</body>
</html>
