<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>เกม AR เก็บผลไม้ ฝึกสมอง</title>
  <style>
    :root{
      --glass: rgba(255,255,255,.86);
      --ink:#263238;
      --accent:#ff8a65;
      --good:#2e7d32;
      --bad:#c62828;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:#dff5ff;color:var(--ink)}
    #app{position:relative;width:100%;height:100%;overflow:hidden}
    video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:linear-gradient(#b3e5fc,#e8f5e9)}
    canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
    .topbar{position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:8px;justify-content:space-between;z-index:5}
    .pill{background:var(--glass);backdrop-filter:blur(8px);border-radius:18px;padding:9px 13px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.14);font-size:clamp(15px,4vw,22px)}
    .score{min-width:110px;text-align:center}
    .timer{min-width:90px;text-align:center}
    .center-card{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;padding:22px;background:rgba(20,40,50,.20)}
    .card{width:min(92vw,520px);background:rgba(255,255,255,.95);border-radius:28px;padding:24px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.22)}
    h1{margin:0 0 10px;font-size:clamp(28px,7vw,46px);color:#ef6c00}
    p{font-size:clamp(17px,4.4vw,22px);line-height:1.55;margin:9px 0}
    .rules{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
    .rule{border-radius:18px;padding:13px;font-weight:800;font-size:clamp(16px,4vw,20px)}
    .good{background:#e8f5e9;color:var(--good)}
    .bad{background:#ffebee;color:var(--bad)}
    button{border:0;border-radius:18px;padding:14px 20px;font-size:clamp(18px,5vw,24px);font-weight:900;cursor:pointer;margin:5px}
    #startBtn,#restartBtn{background:linear-gradient(135deg,#ffb74d,#ff7043);color:#fff;box-shadow:0 7px 0 #d84315}
    #startBtn:active,#restartBtn:active{transform:translateY(4px);box-shadow:0 3px 0 #d84315}
    #modeBtn{background:#fff3e0;color:#e65100;border:2px solid #ffb74d}
    #message{position:absolute;left:50%;top:21%;transform:translateX(-50%);z-index:6;padding:10px 18px;border-radius:22px;background:rgba(255,255,255,.92);font-size:clamp(22px,7vw,42px);font-weight:1000;opacity:0;transition:.2s;white-space:nowrap}
    #cursor{position:absolute;width:52px;height:52px;border:5px solid #fff;border-radius:50%;box-shadow:0 0 0 5px rgba(255,152,0,.8),0 3px 12px rgba(0,0,0,.35);pointer-events:none;z-index:7;display:none;transform:translate(-50%,-50%)}
    .footer{position:absolute;bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:5;background:var(--glass);padding:8px 14px;border-radius:18px;font-weight:700;text-align:center;width:max-content;max-width:94vw}
    .hidden{display:none!important}
    .small{font-size:14px;opacity:.8}
  </style>
</head>
<body>
<div id="app">
  <video id="camera" autoplay playsinline muted></video>
  <canvas id="game"></canvas>
  <div id="cursor"></div>

  <div class="topbar">
    <div class="pill score">⭐ คะแนน <span id="score">0</span></div>
    <div class="pill timer">⏱️ <span id="time">60</span> วินาที</div>
  </div>

  <div id="message">เก่งมากค่ะ +1</div>
  <div class="footer" id="hint">ยื่นนิ้วชี้ไปแตะผลไม้ หรือแตะหน้าจอ</div>

  <div class="center-card" id="startScreen">
    <div class="card">
      <h1>🍎 เกม AR เก็บผลไม้</h1>
      <p>ปรับภาพให้ใหญ่และชัด เหมาะสำหรับมือถือ</p>
      <div class="rules">
        <div class="rule good">🍊 เก็บผลไม้<br>+1 คะแนน</div>
        <div class="rule bad">🧸 เก็บของอื่น<br>−1 คะแนน</div>
      </div>
      <p>ใช้กล้องและนิ้วชี้แตะวัตถุ<br>หรือเลือกโหมดแตะหน้าจอ</p>
      <button id="startBtn">เริ่มเล่น</button>
      <button id="modeBtn">โหมด: มือ AR</button>
      <p class="small">อนุญาตการใช้กล้องเมื่อระบบถาม</p>
    </div>
  </div>

  <div class="center-card hidden" id="endScreen">
    <div class="card">
      <h1>🎉 จบเกมแล้ว</h1>
      <p>คะแนนรวม</p>
      <div style="font-size:70px;font-weight:1000;color:#ef6c00" id="finalScore">0</div>
      <p id="resultText">เยี่ยมมากค่ะ</p>
      <button id="restartBtn">เล่นอีกครั้ง</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const video = document.getElementById('camera');
const scoreEl = document.getElementById('score');
const timeEl = document.getElementById('time');
const messageEl = document.getElementById('message');
const cursorEl = document.getElementById('cursor');
const startScreen = document.getElementById('startScreen');
const endScreen = document.getElementById('endScreen');
const finalScore = document.getElementById('finalScore');
const resultText = document.getElementById('resultText');
const modeBtn = document.getElementById('modeBtn');
const hint = document.getElementById('hint');

const fruits = ['🍎','🍊','🍌','🍇','🍓','🍉','🥭','🍍','🍐','🥝'];
const nonFruits = ['🧸','🚗','⚽','🧦','📱','✏️','🎁','🪥','🧢','🔑'];

let objects=[], score=0, timeLeft=60, running=false, lastSpawn=0, lastTime=0;
let useHand=true, handX=-100, handY=-100, lastHitAt=0, timerId=null, cameraObj=null;
let audioCtx;

function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,3);
  canvas.width=innerWidth*dpr; canvas.height=innerHeight*dpr;
  canvas.style.width=innerWidth+'px'; canvas.style.height=innerHeight+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize); resize();

function speak(text){
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='th-TH'; u.rate=.95; u.pitch=1.1;
    speechSynthesis.speak(u);
  }catch(e){}
}
function beep(good){
  try{
    audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value=good?720:210; g.gain.value=.12;
    o.start(); o.stop(audioCtx.currentTime+.14);
  }catch(e){}
}
function showMessage(text, good){
  messageEl.textContent=text;
  messageEl.style.color=good?'#2e7d32':'#c62828';
  messageEl.style.opacity='1';
  setTimeout(()=>messageEl.style.opacity='0',650);
}
function spawn(){
  const isFruit=Math.random()<.68;
  const base = innerWidth <= 480 ? 96 : (innerWidth <= 768 ? 88 : 78);
  const size=base+Math.random()*18;
  objects.push({
    x:45+Math.random()*(innerWidth-90),
    y:-size,
    size,
    vy:1.05+Math.random()*1.15,
    vx:(Math.random()-.5)*.45,
    rot:(Math.random()-.5)*.008,
    a:0,
    isFruit,
    emoji:(isFruit?fruits:nonFruits)[Math.floor(Math.random()*(isFruit?fruits.length:nonFruits.length))]
  });
}
function hitTest(x,y){
  if(!running || performance.now()-lastHitAt<170) return;
  for(let i=objects.length-1;i>=0;i--){
    const o=objects[i];
    const dx=x-o.x, dy=y-o.y;
    if(Math.hypot(dx,dy)<o.size*.62){
      lastHitAt=performance.now();
      objects.splice(i,1);
      if(o.isFruit){
        score++; showMessage('เก่งมากค่ะ +1',true); speak('เก่งมากค่ะ'); beep(true);
      }else{
        score--; showMessage('ไม่ใช่ผลไม้ ลบ 1',false); speak('ไม่ใช่ผลไม้ค่ะ'); beep(false);
      }
      scoreEl.textContent=score;
      return;
    }
  }
}
canvas.addEventListener('pointerdown',e=>{
  if(!useHand) hitTest(e.clientX,e.clientY);
});

function drawBackground(){
  if(video.readyState<2){
    const g=ctx.createLinearGradient(0,0,0,innerHeight);
    g.addColorStop(0,'#b3e5fc'); g.addColorStop(1,'#e8f5e9');
    ctx.fillStyle=g; ctx.fillRect(0,0,innerWidth,innerHeight);
  }
}
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min(32,t-lastTime||16); lastTime=t;
  ctx.clearRect(0,0,innerWidth,innerHeight);
  drawBackground();
  if(running && t-lastSpawn>900){
    spawn(); lastSpawn=t;
  }
  for(let i=objects.length-1;i>=0;i--){
    const o=objects[i];
    o.y+=o.vy*dt/16; o.x+=o.vx*dt/16; o.a+=o.rot*dt;
    ctx.save();
    ctx.translate(o.x,o.y); ctx.rotate(o.a);
    ctx.font=`${o.size}px Apple Color Emoji, Segoe UI Emoji, sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.beginPath(); ctx.arc(0,0,o.size*.48,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,.90)'; ctx.fill();
    ctx.lineWidth=4; ctx.strokeStyle=o.isFruit?'rgba(76,175,80,.85)':'rgba(239,83,80,.75)'; ctx.stroke();
    ctx.font=`${Math.round(o.size*.84)}px Apple Color Emoji, Segoe UI Emoji, sans-serif`;
    ctx.shadowColor='transparent';
    ctx.fillText(o.emoji,0,2);
    ctx.restore();
    if(o.y>innerHeight+100) objects.splice(i,1);
  }
  if(useHand && running && handX>=0) hitTest(handX,handY);
}
requestAnimationFrame(loop);

async function setupHandTracking(){
  if(!useHand) return;
  try{
    const hands=new Hands({locateFile:file=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
    hands.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:.55,minTrackingConfidence:.5});
    hands.onResults(results=>{
      if(results.multiHandLandmarks?.length){
        const lm=results.multiHandLandmarks[0][8];
        handX=(1-lm.x)*innerWidth;
        handY=lm.y*innerHeight;
        cursorEl.style.display='block';
        cursorEl.style.left=handX+'px'; cursorEl.style.top=handY+'px';
      }else{
        handX=-100; handY=-100; cursorEl.style.display='none';
      }
    });
    cameraObj=new Camera(video,{
      onFrame:async()=>{ if(running) await hands.send({image:video}); },
      width:960,height:720
    });
    await cameraObj.start();
  }catch(err){
    useHand=false;
    modeBtn.textContent='โหมด: แตะหน้าจอ';
    hint.textContent='แตะผลไม้บนหน้าจอ';
    cursorEl.style.display='none';
    try{
      const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
      video.srcObject=stream;
    }catch(e){}
  }
}

function startGame(){
  score=0; timeLeft=60; objects=[];
  scoreEl.textContent='0'; timeEl.textContent='60';
  startScreen.classList.add('hidden'); endScreen.classList.add('hidden');
  running=true; lastSpawn=performance.now();
  clearInterval(timerId);
  timerId=setInterval(()=>{
    timeLeft--; timeEl.textContent=timeLeft;
    if(timeLeft<=0) endGame();
  },1000);
  if(useHand && !cameraObj) setupHandTracking();
}
function endGame(){
  running=false; clearInterval(timerId);
  cursorEl.style.display='none';
  finalScore.textContent=score;
  resultText.textContent=score>=25?'ยอดเยี่ยมมากค่ะ ความไวดีมาก!':score>=12?'เก่งมากค่ะ ลองเล่นอีกครั้งนะคะ':'ฝึกต่ออีกนิด คะแนนจะดีขึ้นค่ะ';
  endScreen.classList.remove('hidden');
  speak('จบเกมแล้วค่ะ ได้ '+score+' คะแนน');
}
modeBtn.addEventListener('click',()=>{
  useHand=!useHand;
  modeBtn.textContent=useHand?'โหมด: มือ AR':'โหมด: แตะหน้าจอ';
  hint.textContent=useHand?'ยื่นนิ้วชี้ไปแตะผลไม้':'แตะผลไม้บนหน้าจอ';
  cursorEl.style.display='none';
});
document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('restartBtn').addEventListener('click',startGame);
</script>
</body>
</html>
