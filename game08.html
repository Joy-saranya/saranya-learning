<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>เกมจับคู่ภาพสีสำหรับผู้สูงอายุ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Tahoma, "Noto Sans Thai", sans-serif;
      text-align: center;
      background: linear-gradient(180deg, #fff9e8, #fff0d7);
      color: #333;
      min-height: 100vh;
    }

    h1 {
      margin: 10px 0;
      font-size: clamp(30px, 6vw, 48px);
      color: #d85c2b;
    }

    .description {
      margin: 8px auto 18px;
      max-width: 700px;
      font-size: clamp(20px, 3.5vw, 27px);
      line-height: 1.6;
    }

    .information {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 20px;
    }

    .information-box {
      min-width: 170px;
      padding: 12px 24px;
      background: white;
      border: 3px solid #efb561;
      border-radius: 18px;
      font-size: clamp(22px, 4vw, 30px);
      font-weight: bold;
      box-shadow: 0 5px 0 rgba(151, 94, 27, 0.15);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, minmax(85px, 135px));
      gap: 16px;
      justify-content: center;
      max-width: 650px;
      margin: 0 auto;
    }

    .card {
      width: 100%;
      aspect-ratio: 1 / 1;
      border: 5px solid white;
      border-radius: 22px;
      background: #78b9d8;
      box-shadow: 0 7px 0 #397c9d;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(42px, 8vw, 70px);
      user-select: none;
      transition:
        transform 0.2s,
        background 0.3s,
        box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
    }

    .card:active {
      transform: translateY(4px);
      box-shadow: 0 3px 0 #397c9d;
    }

    .card.open {
      box-shadow: 0 7px 0 rgba(0, 0, 0, 0.2);
    }

    .card.matched {
      border: 7px solid #2e9e54;
      box-shadow: 0 0 0 5px #bce8c8;
      cursor: default;
      animation: celebrate 0.6s ease;
    }

    .card-back {
      color: white;
      font-weight: bold;
    }

    @keyframes celebrate {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.14) rotate(3deg);
      }

      100% {
        transform: scale(1);
      }
    }

    #message {
      min-height: 48px;
      margin: 20px 0 8px;
      font-size: clamp(24px, 4vw, 34px);
      font-weight: bold;
      color: #287748;
    }

    button {
      margin: 10px;
      padding: 14px 32px;
      border: none;
      border-radius: 18px;
      background: #f18642;
      color: white;
      font-family: inherit;
      font-size: clamp(22px, 4vw, 29px);
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 0 #b4521d;
    }

    button:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #b4521d;
    }

    .footer {
      margin-top: 22px;
      font-size: 18px;
      color: #755c4a;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .board {
        grid-template-columns: repeat(3, minmax(80px, 115px));
        gap: 12px;
      }

      .card {
        border-radius: 18px;
      }
    }
  </style>
</head>

<body>
  <h1>🧠 เกมจับคู่ภาพสี</h1>

  <div class="description">
    เปิดการ์ดครั้งละ 2 ใบ<br />
    จับคู่ภาพที่มีสีเดียวกันให้ครบ 6 คู่
  </div>

  <div class="information">
    <div class="information-box">
      คะแนน: <span id="score">0</span>
    </div>

    <div class="information-box">
      คู่ที่เหลือ: <span id="remaining">6</span>
    </div>
  </div>

  <main class="board" id="board"></main>

  <div id="message" aria-live="polite">
    เลือกการ์ดใบแรกได้เลยค่ะ
  </div>

  <button type="button" onclick="startGame()">
    🔄 เริ่มเกมใหม่
  </button>

  <div class="footer">
    สื่อฝึกความจำสำหรับนักเรียนผู้สูงอายุ อายุ 60 ปีขึ้นไป
  </div>

  <script>
    const picturePairs = [
      {
        id: "red",
        emoji: "🍎",
        color: "#ef5350",
        name: "สีแดง"
      },
      {
        id: "yellow",
        emoji: "🌻",
        color: "#ffd54f",
        name: "สีเหลือง"
      },
      {
        id: "green",
        emoji: "🍀",
        color: "#66bb6a",
        name: "สีเขียว"
      },
      {
        id: "blue",
        emoji: "🐳",
        color: "#42a5f5",
        name: "สีฟ้า"
      },
      {
        id: "purple",
        emoji: "🍇",
        color: "#ab75d3",
        name: "สีม่วง"
      },
      {
        id: "orange",
        emoji: "🍊",
        color: "#ff963f",
        name: "สีส้ม"
      }
    ];

    let cards = [];
    let firstCard = null;
    let secondCard = null;
    let boardLocked = false;
    let score = 0;

    const board = document.getElementById("board");
    const scoreElement = document.getElementById("score");
    const remainingElement = document.getElementById("remaining");
    const messageElement = document.getElementById("message");

    function shuffle(array) {
      const shuffled = [...array];

      for (let i = shuffled.length - 1; i > 0; i--) {
        const randomIndex = Math.floor(Math.random() * (i + 1));

        [shuffled[i], shuffled[randomIndex]] = [
          shuffled[randomIndex],
          shuffled[i]
        ];
      }

      return shuffled;
    }

    function speak(text) {
      if (!("speechSynthesis" in window)) {
        return;
      }

      window.speechSynthesis.cancel();

      const speech = new SpeechSynthesisUtterance(text);

      speech.lang = "th-TH";
      speech.rate = 0.85;
      speech.pitch = 1;
      speech.volume = 1;

      const voices = window.speechSynthesis.getVoices();

      const thaiVoice = voices.find((voice) =>
        voice.lang.toLowerCase().startsWith("th")
      );

      if (thaiVoice) {
        speech.voice = thaiVoice;
      }

      window.speechSynthesis.speak(speech);
    }

    function startGame() {
      window.speechSynthesis?.cancel();

      firstCard = null;
      secondCard = null;
      boardLocked = false;
      score = 0;

      scoreElement.textContent = score;
      remainingElement.textContent = picturePairs.length;
      messageElement.textContent = "เลือกการ์ดใบแรกได้เลยค่ะ";
      board.innerHTML = "";

      cards = shuffle(
        picturePairs.flatMap((item) => [
          { ...item, uniqueId: `${item.id}-1` },
          { ...item, uniqueId: `${item.id}-2` }
        ])
      );

      cards.forEach((item) => {
        const card = document.createElement("button");

        card.type = "button";
        card.className = "card";
        card.dataset.pairId = item.id;
        card.dataset.emoji = item.emoji;
        card.dataset.color = item.color;
        card.dataset.name = item.name;
        card.setAttribute("aria-label", "การ์ดที่ยังไม่เปิด");

        card.innerHTML = '<span class="card-back">?</span>';

        card.addEventListener("click", () => selectCard(card));

        board.appendChild(card);
      });
    }

    function selectCard(card) {
      if (boardLocked) {
        return;
      }

      if (
        card === firstCard ||
        card.classList.contains("matched") ||
        card.classList.contains("open")
      ) {
        return;
      }

      revealCard(card);

      if (!firstCard) {
        firstCard = card;
        messageElement.textContent = "เลือกการ์ดใบที่สองค่ะ";
        return;
      }

      secondCard = card;
      boardLocked = true;

      checkPair();
    }

    function revealCard(card) {
      card.classList.add("open");
      card.style.background = card.dataset.color;
      card.innerHTML = card.dataset.emoji;
      card.setAttribute(
        "aria-label",
        `${card.dataset.name} รูป ${card.dataset.emoji}`
      );
    }

    function hideCard(card) {
      card.classList.remove("open");
      card.style.background = "#78b9d8";
      card.innerHTML = '<span class="card-back">?</span>';
      card.setAttribute("aria-label", "การ์ดที่ยังไม่เปิด");
    }

    function checkPair() {
      const isSameColor =
        firstCard.dataset.pairId === secondCard.dataset.pairId;

      if (isSameColor) {
        handleCorrectPair();
      } else {
        handleWrongPair();
      }
    }

    function handleCorrectPair() {
      firstCard.classList.add("matched");
      secondCard.classList.add("matched");

      score += 1;

      scoreElement.textContent = score;
      remainingElement.textContent = picturePairs.length - score;
      messageElement.textContent = "เก่งมากค่ะ ⭐";

      speak("เก่งมากค่ะ");

      resetSelectedCards();

      if (score === picturePairs.length) {
        setTimeout(finishGame, 800);
      }
    }

    function handleWrongPair() {
      messageElement.textContent = "ยังไม่ใช่คู่เดียวกัน ลองใหม่นะคะ";

      setTimeout(() => {
        hideCard(firstCard);
        hideCard(secondCard);

        resetSelectedCards();

        messageElement.textContent = "เลือกการ์ดคู่ต่อไปได้เลยค่ะ";
      }, 1200);
    }

    function resetSelectedCards() {
      firstCard = null;
      secondCard = null;
      boardLocked = false;
    }

    function finishGame() {
      messageElement.textContent =
        "🎉 ยินดีด้วยค่ะ จับคู่ครบทั้ง 6 คู่แล้ว";

      speak("ยินดีด้วยค่ะ จับคู่ครบทั้งหกคู่แล้ว เก่งมากค่ะ");
    }

    startGame();
  </script>
</body>
</html>
